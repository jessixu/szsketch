server {
    listen 80;
    server_name aiprint.hichara.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name aiprint.hichara.com;

    root /www/wwwroot/aiprint.hichara.com;
    index index.html index.htm;

    ssl_certificate     /www/server/panel/vhost/cert/aiprint.hichara.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/aiprint.hichara.com/privkey.pem;

    client_max_body_size 20m;

    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location ^~ /uploads/ {
        alias /www/wwwroot/aiprint.hichara.com/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_no_cache 1;
        proxy_cache_bypass 1;

        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_redirect off;
    }
}
